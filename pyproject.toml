[project]
name = "pmbook"
version = "0.0.1"
description = "Venue-agnostic research toolkit for prediction-market microstructure and fee design, built on public chain data."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Thanatchon Chongmankhong" }]
keywords = ["prediction markets", "market microstructure", "fee design", "market quality", "research"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "httpx>=0.27",
    "pydantic-settings>=2.4",
    "structlog>=24.1",
    "typer>=0.12",
]

[project.urls]
Repository = "https://github.com/thanatchon36/pmbook"

[project.scripts]
pmbook = "pmbook.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pmbook"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["scripts/recon"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
files = ["src/pmbook"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=pmbook --cov-report=term-missing --cov-report=xml"

[tool.coverage.run]
branch = true
